<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Memora Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <main class="app-window">

    <!-- App Header -->
    <div class="app-header">
      <div class="dots">
        <span class="red"></span>
        <span class="yellow"></span>
        <span class="green"></span>
      </div>
      <span class="app-title">memora.app</span>
    </div>

    <!-- Cards -->
    <section class="cards">
      <div class="card pink">
        <h3>Project Ideas</h3>
        <p>3 notes</p>
      </div>

      <div class="card blue">
        <h3>Reading List</h3>
        <p>5 notes</p>
      </div>

      <div class="card green">
        <h3>Daily Journal</h3>
        <p>12 notes</p>
      </div>

      <div class="card cream">
        <h3>Work Tasks</h3>
        <p>8 notes</p>
      </div>
    </section>

    <!-- Notes Preview -->
    <section class="notes-preview">
      <div class="line title"></div>
      <div class="line"></div>
      <div class="line"></div>
      <div class="line small"></div>

      <div class="footer">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </section>

  </main>

</body>
</html>
