<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add Note | Student Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Common CSS -->
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      /* ==========================
   ADD NOTE PAGE STYLES
========================== */

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      body {
        background-color: #f5f7fb;
      }

      /* Wrapper */
      .note-wrapper {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      /* Card */
      .note-card {
        background: #ffffff;
        width: 100%;
        max-width: 420px;
        padding: 28px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }

      /* Headings */
      .note-card h2 {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 6px;
        color: #111827;
      }

      .subtitle {
        font-size: 14px;
        color: #6b7280;
        margin-bottom: 22px;
      }

      /* Form */
      .note-form .form-group {
        margin-bottom: 18px;
      }

      .note-form label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #374151;
        margin-bottom: 6px;
      }

      .note-form input,
      .note-form textarea {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #d1d5db;
        font-size: 14px;
        outline: none;
        transition: 0.3s;
      }

      .note-form input:focus,
      .note-form textarea:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
      }

      /* Button */
      .btn-primary {
        width: 100%;
        padding: 11px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: #ffffff;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        transition: 0.3s;
      }

      .btn-primary:hover {
        background: #1e40af;
      }

      /* Mobile Responsive */
      @media (max-width: 480px) {
        .note-card {
          padding: 22px;
        }

        .note-card h2 {
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main class="note-wrapper">
      <section class="note-card">
        <h2>Add New Note</h2>
        <p class="subtitle">Write something important and save it securely</p>

        <form id="noteForm" class="note-form">
          <div class="form-group">
            <label for="title">Title</label>
            <input
              type="text"
              id="title"
              placeholder="Enter note title"
              required
            />
          </div>

          <div class="form-group">
            <label for="description">Content</label>
            <textarea
              id="Content"
              placeholder="Write your note here..."
              rows="5"
              required
            ></textarea>
          </div>

          <button type="submit" id="AddNote" class="btn-primary">
            Add Note
          </button>
        </form>
      </section>
    </main>
    <script src="../js/addNotes.js"></script>
  </body>
</html>
