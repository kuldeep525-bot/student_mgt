<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | StudentMGT</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>

  <body>
    <div class="dashboard">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <h2 class="logo">StudentMGT</h2>

        <nav class="nav">
          <a class="nav-link active">Dashboard</a>
          <a class="nav-link" href="notes.html">My Notes</a>
          <a class="nav-link" href="#">Profile</a>
          <a class="nav-link danger" id="logoutBtn">Logout</a>
        </nav>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="main">
        <!-- TOPBAR -->
        <header class="topbar">
          <h1>Dashboard</h1>
          <div class="user-box" id="username">Hello 👋</div>
        </header>

        <!-- STATS -->
        <section class="stats">
          <div class="stat-card">
            <h3>Total Notes</h3>
            <p id="totalNotes">0</p>
          </div>

          <div class="stat-card">
            <h3>Last Updated</h3>
            <p id="lastUpdated">—</p>
          </div>
        </section>

        <!-- TABLE -->
        <section class="table-card">
          <div class="table-header">
            <h2>Your Notes</h2>
            <button id="addNoteBtn" class="btn btn-primary">+ Add Note</button>
          </div>

          <div class="table-wrapper">
            <table class="notes-table">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Created</th>
                </tr>
              </thead>

              <tbody id="notesTable">
                <!-- JS se dynamically inject hoga -->
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <!-- MODAL -->
    <!-- <div class="modal-overlay" id="noteModal">
      <div class="modal">
        <header class="modal-header">
          <h2>Add Note</h2>
          <span id="closeModal" class="close-btn">&times;</span>
        </header>

        <input type="text" id="noteTitle" placeholder="Note title" />
        <textarea id="noteContent" placeholder="Write your note..."></textarea>

        <footer class="modal-footer">
          <button class="btn btn-outline">Cancel</button>
          <button id="saveNote" class="btn btn-primary">Save</button>
        </footer>
      </div>
    </div> -->

    <script src="../js/dashboard.js"></script>
  </body>
</html>
