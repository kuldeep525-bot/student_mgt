<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard | StudentMGT</title>
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>

  <body>
    <div class="dashboard">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <h2>StudentMGT</h2>

        <nav>
          <a class="active">Dashboard</a>
          <a href="notes.html">My Notes</a>
          <a href="#">Profile</a>
          <a id="logoutBtn">Logout</a>
        </nav>
      </aside>

      <!-- MAIN -->
      <main class="main">
        <!-- TOP -->
        <header class="topbar">
          <h1>My Dashboard</h1>
          <div class="user-box" id="username">Hello 👋</div>
        </header>

        <!-- STATS -->
        <section class="stats">
          <div class="stat-card">
            <h3>Total Notes</h3>
            <p id="totalNotes">0</p>
          </div>

          <div class="stat-card">
            <h3>Last Updated</h3>
            <p id="lastUpdated">—</p>
          </div>
        </section>

        <!-- NOTES TABLE -->
        <section class="table-card">
          <div class="table-header">
            <h2>Your Notes</h2>
            <button id="addNoteBtn" class="btn-primary">+ Add Note</button>
          </div>

          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="notesTable">
              <!-- notes dynamically -->
            </tbody>
          </table>
        </section>
      </main>
    </div>

    <!-- ADD / EDIT MODAL -->
    <div class="modal-overlay" id="noteModal">
      <div class="modal">
        <h2>Add Note</h2>

        <input type="text" id="noteTitle" placeholder="Note title" />
        <textarea id="noteContent" placeholder="Write your note..."></textarea>

        <div class="modal-footer">
          <button id="closeModal" class="btn-outline">Cancel</button>
          <button id="saveNote" class="btn-primary">Save</button>
        </div>
      </div>
    </div>

    <script src="../js/dashboard.js"></script>
  </body>
</html>
