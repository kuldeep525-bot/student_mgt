<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memora – All Notes</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>

  <body data-page="notes">
    <div class="app">
      <!-- SIDEBAR -->
      <aside>
        <div class="logo">STUMGT</div>

        <nav>
          <div
            class="nav-item"
            data-page="dashboard"
            data-tooltip="Dashboard overview"
            onclick="location.href = 'dashboard.html'"
          >
            <i class="ri-layout-grid-line"></i>Dashboard
          </div>

          <div
            class="nav-item"
            data-page="notes"
            data-tooltip="All your notes"
            onclick="location.href = 'notes.html'"
          >
            <i class="ri-sticky-note-line"></i>Notes
          </div>

          <div
            class="nav-item"
            data-page="favorites"
            data-tooltip="Starred notes"
            onclick="location.href = 'favorites.html'"
          >
            <i class="ri-star-line"></i>Favorites
          </div>

          <div
            class="nav-item"
            data-page="archive"
            data-tooltip="Archived notes"
            onclick="location.href = 'archive.html'"
          >
            <i class="ri-archive-line"></i>Archive
          </div>

          <div
            class="nav-item"
            data-page="bin"
            data-tooltip="Deleted notes"
            onclick="location.href = 'bin.html'"
          >
            <i class="ri-delete-bin-line"></i>Bin
          </div>
        </nav>

        <!-- BOTTOM -->
        <div class="nav-bottom">
          <div
            class="nav-item"
            data-page="profile"
            data-tooltip="Profile & settings"
            onclick="location.href = 'profile.html'"
          >
            <i class="ri-user-3-line"></i>Profile
          </div>

          <div class="nav-item" id="themeToggle" data-tooltip="Toggle theme">
            <i class="ri-moon-line"></i>Theme
          </div>
        </div>
      </aside>

      <!-- MAIN -->
      <main>
        <header>
          <div>
            <h1>All Notes</h1>
            <p class="subtitle">Everything you’ve written</p>
          </div>

          <div class="actions">
            <button id="addNote" class="btn primary">+ Add Note</button>
          </div>
        </header>

        <section id="notesGrid" class="notes-grid"></section>

        <div id="emptyState" class="empty">
          <h3>No notes found</h3>
          <p class="quote">Start writing something meaningful.</p>
        </div>
      </main>

      <!-- MODAL -->
      <div id="noteModal" class="modal">
        <div class="modal-box">
          <h3 id="modalTitle">Add Note</h3>
          <input id="noteTitle" placeholder="Title" />
          <textarea
            id="noteContent"
            placeholder="Write your note..."
          ></textarea>
          <div class="modal-actions">
            <button id="closeModal" class="btn">Cancel</button>
            <button id="saveNote" class="btn primary">Save</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const currentPage = document.body.getAttribute("data-page");
      document.querySelectorAll(".nav-item").forEach((item) => {
        if (item.dataset.page === currentPage) {
          item.classList.add("active");
        }
      });

      /* ================= STATE ================= */
      let notes = JSON.parse(localStorage.getItem("memora_notes") || "[]");
      let editId = null;

      const grid = document.getElementById("notesGrid");
      const empty = document.getElementById("emptyState");
      const modal = document.getElementById("noteModal");
      const modalTitle = document.getElementById("modalTitle");
      const noteTitle = document.getElementById("noteTitle");
      const noteContent = document.getElementById("noteContent");

      /* ================= THEME ================= */
      const savedTheme = localStorage.getItem("memora_theme");
      if (savedTheme === "light") document.body.classList.add("light-theme");

      document.getElementById("themeToggle").onclick = () => {
        document.body.classList.toggle("light-theme");
        localStorage.setItem(
          "memora_theme",
          document.body.classList.contains("light-theme") ? "light" : "dark",
        );
      };

      /* ================= RENDER ================= */
      function renderNotes() {
        const activeNotes = notes.filter((n) => !n.deleted);
        grid.innerHTML = "";

        if (!activeNotes.length) {
          empty.style.display = "block";
          return;
        }

        empty.style.display = "none";

        activeNotes.forEach((n) => {
          const div = document.createElement("div");
          div.className = "note";

          div.innerHTML = `
          <h4>${n.title}</h4>
          <p>${n.content}</p>

          <div class="note-actions">
            <button onclick="toggleFavorite(${n.id})">
              <i class="${n.favorite ? "ri-star-fill" : "ri-star-line"}"></i>
            </button>
            <button onclick="editNote(${n.id})">
              <i class="ri-edit-line"></i>
            </button>
            <button onclick="deleteNote(${n.id})">
              <i class="ri-delete-bin-line"></i>
            </button>
          </div>
        `;

          grid.appendChild(div);
        });
      }

      /* ================= ACTIONS ================= */
      function toggleFavorite(id) {
        notes = notes.map((n) =>
          n.id === id ? { ...n, favorite: !n.favorite } : n,
        );
        saveAndRender();
      }

      function deleteNote(id) {
        notes = notes.map((n) => (n.id === id ? { ...n, deleted: true } : n));
        saveAndRender();
      }

      function editNote(id) {
        const note = notes.find((n) => n.id === id);
        editId = id;
        modalTitle.innerText = "Edit Note";
        noteTitle.value = note.title;
        noteContent.value = note.content;
        modal.classList.add("active");
      }

      /* ================= MODAL ================= */
      document.getElementById("addNote").onclick = () => {
        editId = null;
        modalTitle.innerText = "Add Note";
        noteTitle.value = "";
        noteContent.value = "";
        modal.classList.add("active");
      };

      document.getElementById("closeModal").onclick = () => {
        modal.classList.remove("active");
      };

      document.getElementById("saveNote").onclick = () => {
        if (!noteTitle.value || !noteContent.value) return;

        if (editId) {
          notes = notes.map((n) =>
            n.id === editId
              ? { ...n, title: noteTitle.value, content: noteContent.value }
              : n,
          );
        } else {
          notes.unshift({
            id: Date.now(),
            title: noteTitle.value,
            content: noteContent.value,
            favorite: false,
            deleted: false,
          });
        }

        modal.classList.remove("active");
        saveAndRender();
      };

      function saveAndRender() {
        localStorage.setItem("memora_notes", JSON.stringify(notes));
        renderNotes();
      }

      renderNotes();
    </script>

    <style>
      /* Note action buttons */
      .note-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 12px;
      }

      .note-actions button {
        background: transparent;
        border: none;
        cursor: pointer;
        color: var(--text-secondary);
        font-size: 18px;
      }

      .note-actions button:hover {
        color: var(--text-primary);
      }
    </style>
  </body>
</html>
