<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memora – Profile</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/dashboard.css" />
  </head>

  <body data-page="profile">
    <div class="app">
      <!-- SIDEBAR -->
      <aside>
        <div class="logo">STUMGT</div>

        <nav>
          <div
            class="nav-item"
            data-page="dashboard"
            data-tooltip="Dashboard overview"
            onclick="location.href = 'dashboard.html'"
          >
            <i class="ri-layout-grid-line"></i>Dashboard
          </div>
          <div
            class="nav-item"
            data-page="notes"
            data-tooltip="All your notes"
            onclick="location.href = 'notes.html'"
          >
            <i class="ri-sticky-note-line"></i>Notes
          </div>
          <div
            class="nav-item"
            data-page="favorites"
            data-tooltip="Starred notes"
            onclick="location.href = 'favorites.html'"
          >
            <i class="ri-star-line"></i>Favorites
          </div>
          <div
            class="nav-item"
            data-page="archive"
            data-tooltip="Archived notes"
            onclick="location.href = 'archive.html'"
          >
            <i class="ri-archive-line"></i>Archive
          </div>
          <div
            class="nav-item"
            data-page="bin"
            data-tooltip="Deleted notes"
            onclick="location.href = 'bin.html'"
          >
            <i class="ri-delete-bin-line"></i>Bin
          </div>
        </nav>

        <div class="nav-bottom">
          <div
            class="nav-item"
            data-page="profile"
            data-tooltip="Profile & settings"
          >
            <i class="ri-user-3-line"></i>Profile
          </div>
          <div class="nav-item" id="themeToggle" data-tooltip="Toggle theme">
            <i class="ri-moon-line"></i>Theme
          </div>
        </div>
      </aside>

      <!-- MAIN -->
      <main>
        <header>
          <div>
            <h1>Profile</h1>
            <p class="subtitle">Manage your account & preferences</p>
          </div>
        </header>

        <!-- PROFILE LAYOUT -->
        <section class="profile-layout">
          <!-- LEFT: USER SUMMARY -->
          <div class="profile-card">
            <div class="avatar">
              <i class="ri-user-3-line"></i>
            </div>
            <h3 class="profile-name">Your Name</h3>
            <p class="profile-email">email@example.com</p>

            <button class="btn logout" id="logout">
              <i class="ri-logout-box-line"></i> Logout
            </button>
          </div>

          <!-- RIGHT: SETTINGS -->
          <div class="profile-settings">
            <div class="note">
              <h4>Account Information</h4>

              <label>Name</label>
              <input class="profile-input" placeholder="Your name" />

              <label>Email</label>
              <input class="profile-input" placeholder="email@example.com" />

              <button class="btn primary">Save Changes</button>
            </div>

            <div class="note">
              <h4>Security</h4>
              <button class="btn">Change Password</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        /* ACTIVE STATE */
        const currentPage = document.body.dataset.page;
        document.querySelectorAll(".nav-item").forEach((item) => {
          if (item.dataset.page === currentPage) {
            item.classList.add("active");
          }
        });

        /* THEME */
        const savedTheme = localStorage.getItem("memora_theme");
        if (savedTheme === "light") document.body.classList.add("light-theme");

        document.getElementById("themeToggle").onclick = () => {
          document.body.classList.toggle("light-theme");
          localStorage.setItem(
            "memora_theme",
            document.body.classList.contains("light-theme") ? "light" : "dark",
          );
        };
      });
    </script>

    <style>
      /* PROFILE LAYOUT */
      .profile-layout {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 24px;
      }

      /* LEFT CARD */
      .profile-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius);
        padding: 20px;
        text-align: center;
        height: fit-content;
      }

      .avatar {
        width: 72px;
        height: 72px;
        margin: 0 auto 12px;
        border-radius: 50%;
        background: var(--bg-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
      }

      .profile-name {
        font-size: 16px;
        font-weight: 600;
      }

      .profile-email {
        font-size: 13px;
        color: var(--text-secondary);
        margin-bottom: 16px;
      }

      .logout {
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 8px;
      }

      /* RIGHT SETTINGS */
      .profile-settings {
        display: grid;
        gap: 20px;
      }

      /* INPUTS */
      .profile-input {
        width: 100%;
        padding: 10px 12px;
        border-radius: var(--radius);
        border: 1px solid var(--border-color);
        background: transparent;
        color: var(--text-primary);
        margin: 8px 0 14px;
      }

      label {
        font-size: 13px;
        color: var(--text-secondary);
      }

      /* RESPONSIVE */
      @media (max-width: 900px) {
        .profile-layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <script type="module" src="../js/auth.js"></script>
  </body>
</html>
